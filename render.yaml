services:
  - type: web
    name: quanlydoxe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: WEB_SEARCH_URL
        value: https://html.duckduckgo.com/html/
      - key: NODE_AI_SINGLE_SERVICE
        value: "true"
      - key: NODE_INTERNAL_PORT
        value: "3100"
      - key: NODE_AI_URL
        value: http://127.0.0.1:3100
      - key: NODE_AI_TIMEOUT_SECONDS
        value: "55"
      - key: AI_SUPPORT_TIMEOUT_SECONDS
        value: "60"
