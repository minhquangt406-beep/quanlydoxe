services:
  - type: web
    name: parking-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parking-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: parking-ai-db
    databaseName: parking_ai
    user: parking_ai
    plan: basic-256mb
