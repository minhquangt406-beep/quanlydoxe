services:
  - type: web
    name: quanlydoxe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: WEB_SEARCH_CONTEXT_SIZE
        value: medium
      - key: NODE_AI_SINGLE_SERVICE
        value: "true"
      - key: NODE_INTERNAL_PORT
        value: "3100"
      - key: NODE_AI_URL
        value: http://127.0.0.1:3100
      - key: NODE_AI_TIMEOUT_SECONDS
        value: "55"
      - key: AI_SUPPORT_TIMEOUT_SECONDS
        value: "60"
