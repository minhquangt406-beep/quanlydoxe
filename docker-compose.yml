services:
  quanlydoxe:
    build: .
    container_name: quanlydoxe
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NODE_AI_SINGLE_SERVICE=true
      - NODE_AI_URL=http://127.0.0.1:3100
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_CONTEXT_SIZE=${WEB_SEARCH_CONTEXT_SIZE:-medium}
    volumes:
      - parking_data:/app/data
    restart: unless-stopped

volumes:
  parking_data:
